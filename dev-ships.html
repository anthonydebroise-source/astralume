<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><title>Vaisseaux</title></head>
<body style="margin:0;background:#06041a">
<canvas id="c" width="1000" height="920"></canvas>
<script type="module">
import { drawHypercar } from './js/game/hypercar.js';
import { SHIPS } from './js/economy/data.js';
const c = document.getElementById('c'), g = c.getContext('2d');
const q = new URLSearchParams(location.search);
const skin = +(q.get('skin') || 0);
let t = 0.5;
function draw() {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#0a0620'; g.fillRect(0, 0, 1000, 920);
  for (const [row, tier] of [[0, 0], [1, 3]]) SHIPS.forEach((s, i) => {
    g.setTransform(3.2, 0, 0, 3.2, 100 + (i % 5) * 200, 115 + Math.floor(i / 5) * 225 + row * 455);
    drawHypercar(g, s.id, t + i * 0.7, 0, { tier, skin });
  });
}
draw();
window.ready = true;
</script></body></html>
